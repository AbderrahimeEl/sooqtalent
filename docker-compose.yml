version: '3.8'

services:
  app:
    build: .
    container_name: sooqtalent-app
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sooqtalent?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123
    ports:
      - "8080:8080"
    restart: always

  db:
    image: mysql:latest
    container_name: mysql-cont
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: sooqtalent
      MYSQL_PASSWORD: 123
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"

volumes:
  db_data:
